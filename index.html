<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Ticket2h: mua vé sự kiện, nhận vé QR" />
    <title>Ticket2h</title>
    <!-- Be Vietnam Pro (chữ giao diện) và Bricolage Grotesque (tiêu đề, poster): cả hai có bộ dấu tiếng Việt -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap"
    />
    <!-- Áp theme đã lưu trước khi React chạy, để chế độ tối không nháy nền sáng. Cùng storageKey với ThemeProvider. -->
    <script>
      try {
        var t = localStorage.getItem('momi-theme') || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
